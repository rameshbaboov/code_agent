<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>{% block title %}Code Agent Control Panel{% endblock %}</title>
    <style>
        :root {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color-scheme: light dark;
        }
        body {
            margin: 0;
            background: #0f172a;
            color: #e5e7eb;
        }
        header {
            background: #020617;
            padding: 1rem 2rem;
            border-bottom: 1px solid #1f2937;
        }
        header h1 {
            margin: 0;
            font-size: 1.25rem;
        }
        main {
            max-width: 960px;
            margin: 1.5rem auto;
            padding: 1.5rem;
            background: #020617;
            border-radius: 0.75rem;
            box-shadow: 0 18px 45px rgba(0,0,0,0.6);
            border: 1px solid #1e293b;
        }
        a {
            color: #60a5fa;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .btn {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            border-radius: 0.375rem;
            border: none;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .btn.secondary {
            background: #4b5563;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem 1.5rem;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            font-size: 0.9rem;
        }
        label {
            font-weight: 500;
        }
        input[type="text"],
        input[type="number"],
        select {
            padding: 0.45rem 0.5rem;
            border-radius: 0.375rem;
            border: 1px solid #4b5563;
            background: #020617;
            color: #e5e7eb;
        }
        small {
            color: #9ca3af;
            font-size: 0.8rem;
        }
        .panel {
            border: 1px solid #1f2937;
            border-radius: 0.5rem;
            padding: 1rem;
            background: #020617;
            margin-top: 1rem;
        }
        pre {
            background: #020617;
            border-radius: 0.5rem;
            padding: 0.75rem;
            overflow: auto;
            font-size: 0.85rem;
            border: 1px solid #111827;
        }
        .status-ok {
            color: #22c55e;
            font-weight: 600;
        }
        .status-fail {
            color: #f97373;
            font-weight: 600;
        }
        .stacked {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
<header>
    <h1>Code Agent Control Panel</h1>
</header>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
